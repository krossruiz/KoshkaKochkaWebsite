<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Runner</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  * { box-sizing: border-box; }
  html { background: #008080; }
  body {
    margin: 0; font-family: "Times New Roman", Times, serif; color: #000;
    background: #008080;
    background-image: radial-gradient(circle at 6px 6px, rgba(255,255,255,0.06) 1.5px, transparent 1.6px);
    background-size: 24px 24px;
  }
  a { color: #0000EE; } a:visited { color: #551A8B; } a:active { color: #FF0000; }
  .page {
    max-width: 900px; margin: 18px auto 40px; background: #C0C0C0;
    border: 4px outset #ffffff; padding: 10px; box-shadow: 6px 6px 0 rgba(0,0,0,0.35);
  }
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0 50%, #000080); color: #fff;
    font-family: Arial, Helvetica, sans-serif; font-weight: bold; font-size: 0.85rem;
    padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
  }
  header {
    padding: 10px; border: 2px inset #808080; background: #fff;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  header h1 { font-size: 1.15rem; margin: 0; font-family: "Comic Sans MS", cursive; color: #000080; }
  header a { color: #0000EE; text-decoration: none; font-size: 0.85rem; font-family: Arial, sans-serif; font-weight: bold; }
  main { padding: 0; }
  #status {
    font-family: "Courier New", monospace; font-size: 0.85rem; color: #000080;
    background: #fff; border: 2px inset #808080; padding: 5px 8px; margin-bottom: 10px;
  }
  #console {
    background: #000; color: #00ff00; font-family: "Courier New", Consolas, monospace;
    font-size: 0.85rem; padding: 14px; min-height: 220px; border: 3px inset #808080;
    white-space: pre-wrap; word-break: break-word;
  }
  #imgOut { margin-top: 14px; text-align: center; }
  #imgOut img { max-width: 100%; border: 3px outset #ffffff; background: #fff; padding: 4px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    background: #C0C0C0; color: #000; border: 2px outset #ffffff;
    padding: 7px 16px; cursor: pointer; font-size: 0.85rem; font-family: Arial, sans-serif; font-weight: bold;
  }
  button:hover { background: #d8d8d8; }
  button:active { border-style: inset; }
  button:disabled { opacity: 0.5; cursor: default; }
  .note {
    color: #660000; font-size: 0.8rem; margin-top: 10px; font-family: Arial, sans-serif;
    background: #ffffcc; border: 2px dashed #ff0000; padding: 6px 8px;
  }
</style>
</head>
<body>
<div class="page">
  <div class="titlebar">
    <span>python-runner.exe</span>
    <span>&#9633;</span>
  </div>
  <header>
    <h1 id="title">&#9658; Python Runner</h1>
    <a href="index.html">&larr; Back to Project Directory</a>
  </header>
  <main>
    <div id="status">Loading Pyodide runtime…</div>
    <div id="console"></div>
    <div id="imgOut"></div>
    <div class="row">
      <button id="runBtn" disabled>&#9658; Run again</button>
    </div>
    <p class="note">Running fully in your browser via <a href="https://pyodide.org" target="_blank">Pyodide</a> (Python compiled to WebAssembly) - no server, no install. This program calling <code>input()</code> will prompt you with a browser dialog.</p>
  </main>
</div>

<script>
const params = new URLSearchParams(location.search);
const src = params.get("src");
const mode = params.get("mode") || "plain";
const title = params.get("title") || "Python Runner";
document.getElementById("title").textContent = title;
document.title = title + " - Python Runner";

const consoleEl = document.getElementById("console");
const statusEl = document.getElementById("status");
const imgOut = document.getElementById("imgOut");
const runBtn = document.getElementById("runBtn");

function appendLine(text) {
  consoleEl.textContent += text + "\n";
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

let pyodide;

async function setup() {
  if (!src) {
    statusEl.textContent = "No script specified (missing ?src= query param).";
    return;
  }
  statusEl.textContent = "Loading Pyodide runtime…";
  pyodide = await loadPyodide({
    stdout: (msg) => appendLine(msg),
    stderr: (msg) => appendLine(msg),
  });

  pyodide.globals.set("_js_input", (promptText) => {
    const val = window.prompt(promptText || "Input:");
    appendLine((promptText || "") + (val ?? ""));
    return val ?? "";
  });
  await pyodide.runPythonAsync(`
import builtins
def _input(prompt=""):
    return _js_input(prompt)
builtins.input = _input
`);

  if (mode === "matplotlib") {
    statusEl.textContent = "Loading numpy + matplotlib (this can take a few seconds)…";
    await pyodide.loadPackage(["numpy", "matplotlib"]);
    await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use("AGG")
import matplotlib.pyplot as plt
import io, base64, js as _js

_orig_savefig = plt.savefig

def _snapshot_current_figure():
    buf = io.BytesIO()
    _orig_savefig(buf, format="png", bbox_inches="tight")
    buf.seek(0)
    _js.window._pyodideLastFigure = base64.b64encode(buf.read()).decode()

def _capture_savefig(*a, **kw):
    result = _orig_savefig(*a, **kw)
    try:
        _snapshot_current_figure()
    except Exception:
        pass
    return result

def _capture_show(*a, **kw):
    _snapshot_current_figure()

plt.show = _capture_show
plt.savefig = _capture_savefig
`);
  }

  statusEl.textContent = "Fetching " + src + " …";
  let code;
  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error(res.status);
    code = await res.text();
  } catch (e) {
    statusEl.textContent = "Could not fetch " + src + ". Are you running this via a local server (see README.md), not file://?";
    return;
  }

  runBtn.disabled = false;
  runBtn.onclick = () => run(code);
  statusEl.textContent = "Ready.";
  run(code);
}

async function run(code) {
  consoleEl.textContent = "";
  imgOut.innerHTML = "";
  window._pyodideLastFigure = null;
  statusEl.textContent = "Running…";
  try {
    await pyodide.runPythonAsync(code);
    if (mode === "matplotlib" && window._pyodideLastFigure) {
      imgOut.innerHTML = `<img src="data:image/png;base64,${window._pyodideLastFigure}" alt="matplotlib output">`;
    }
    statusEl.textContent = "Finished.";
  } catch (e) {
    appendLine(String(e));
    statusEl.textContent = "Error - see console output above.";
  }
}

setup();
</script>
</body>
</html>
