<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Runner</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  :root {
    --color-background: #0b0b0b;
    --color-surface: #111111;
    --color-border: #222222;
    --color-text: #e5e5e5;
    --color-muted: #9ca3af;
    --color-accent: #aa0000;
  }
  * { box-sizing: border-box; }
  @font-face {
    font-family: "Acidic";
    src: url("projects/personal_site/fonts/acidic/Acidic.TTF");
  }
  html, body {
    margin: 0; padding: 0; background-color: var(--color-background); color: var(--color-text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--color-accent); }
  .page { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  header {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    border-bottom: 1px solid var(--color-border); padding-bottom: 16px; margin-bottom: 20px;
  }
  header h1 { font-size: 1.3rem; margin: 0; font-family: "Acidic", cursive; color: var(--color-text); }
  header a { color: var(--color-accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
  main { padding: 0; }
  #status {
    font-family: "Courier New", monospace; font-size: 0.85rem; color: var(--color-muted);
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 4px;
    padding: 8px 10px; margin-bottom: 12px;
  }
  #console {
    background: #000; color: #d1fae5; font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.85rem; padding: 16px; min-height: 220px; border-radius: 8px;
    border: 1px solid var(--color-border);
    white-space: pre-wrap; word-break: break-word;
  }
  #imgOut { margin-top: 16px; text-align: center; }
  #imgOut img { max-width: 100%; border-radius: 8px; border: 1px solid var(--color-border); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border);
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
  }
  button:hover { border-color: var(--color-accent); color: var(--color-accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .note {
    color: var(--color-muted); font-size: 0.8rem; margin-top: 12px;
    border-left: 3px solid var(--color-accent); background: var(--color-surface);
    border-radius: 4px; padding: 8px 10px;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title">Python Runner</h1>
    <a href="index.html">&larr; Back to Project Directory</a>
  </header>
  <main>
    <div id="status">Loading Pyodide runtime…</div>
    <div id="console"></div>
    <div id="imgOut"></div>
    <div class="row">
      <button id="runBtn" disabled>Run again</button>
    </div>
    <p class="note">Running fully in your browser via <a href="https://pyodide.org" target="_blank">Pyodide</a> (Python compiled to WebAssembly) - no server, no install. This program calling <code>input()</code> will prompt you with a browser dialog.</p>
  </main>
</div>

<script>
const params = new URLSearchParams(location.search);
const src = params.get("src");
const mode = params.get("mode") || "plain";
const title = params.get("title") || "Python Runner";
document.getElementById("title").textContent = title;
document.title = title + " - Python Runner";

const consoleEl = document.getElementById("console");
const statusEl = document.getElementById("status");
const imgOut = document.getElementById("imgOut");
const runBtn = document.getElementById("runBtn");

function appendLine(text) {
  consoleEl.textContent += text + "\n";
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

let pyodide;

async function setup() {
  if (!src) {
    statusEl.textContent = "No script specified (missing ?src= query param).";
    return;
  }
  statusEl.textContent = "Loading Pyodide runtime…";
  pyodide = await loadPyodide({
    stdout: (msg) => appendLine(msg),
    stderr: (msg) => appendLine(msg),
  });

  pyodide.globals.set("_js_input", (promptText) => {
    const val = window.prompt(promptText || "Input:");
    appendLine((promptText || "") + (val ?? ""));
    return val ?? "";
  });
  await pyodide.runPythonAsync(`
import builtins
def _input(prompt=""):
    return _js_input(prompt)
builtins.input = _input
`);

  if (mode === "matplotlib") {
    statusEl.textContent = "Loading numpy + matplotlib (this can take a few seconds)…";
    await pyodide.loadPackage(["numpy", "matplotlib"]);
    await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use("AGG")
import matplotlib.pyplot as plt
import io, base64, js as _js

_orig_savefig = plt.savefig

def _snapshot_current_figure():
    buf = io.BytesIO()
    _orig_savefig(buf, format="png", bbox_inches="tight")
    buf.seek(0)
    _js.window._pyodideLastFigure = base64.b64encode(buf.read()).decode()

def _capture_savefig(*a, **kw):
    result = _orig_savefig(*a, **kw)
    try:
        _snapshot_current_figure()
    except Exception:
        pass
    return result

def _capture_show(*a, **kw):
    _snapshot_current_figure()

plt.show = _capture_show
plt.savefig = _capture_savefig
`);
  }

  statusEl.textContent = "Fetching " + src + " …";
  let code;
  try {
    const res = await fetch(src);
    if (!res.ok) throw new Error(res.status);
    code = await res.text();
  } catch (e) {
    statusEl.textContent = "Could not fetch " + src + ". Are you running this via a local server (see README.md), not file://?";
    return;
  }

  runBtn.disabled = false;
  runBtn.onclick = () => run(code);
  statusEl.textContent = "Ready.";
  run(code);
}

async function run(code) {
  consoleEl.textContent = "";
  imgOut.innerHTML = "";
  window._pyodideLastFigure = null;
  statusEl.textContent = "Running…";
  try {
    await pyodide.runPythonAsync(code);
    if (mode === "matplotlib" && window._pyodideLastFigure) {
      imgOut.innerHTML = `<img src="data:image/png;base64,${window._pyodideLastFigure}" alt="matplotlib output">`;
    }
    statusEl.textContent = "Finished.";
  } catch (e) {
    appendLine(String(e));
    statusEl.textContent = "Error - see console output above.";
  }
}

setup();
</script>
</body>
</html>
