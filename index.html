<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Directory</title>
<style>
  :root {
    --color-background: #0b0b0b;
    --color-surface: #111111;
    --color-border: #222222;
    --color-text: #e5e5e5;
    --color-muted: #9ca3af;
    --color-accent: #aa0000;
  }
  * { box-sizing: border-box; }
  @font-face {
    font-family: "Acidic";
    src: url("projects/personal_site/fonts/acidic/Acidic.TTF");
  }
  html {
    background-color: var(--color-background);
  }
  body {
    margin: 0; padding: 0;
    color: var(--color-text);
    line-height: 1.6;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--color-accent); }
  a:visited { color: var(--color-accent); }

  /* Live background: three drifting/rotated copies of the navbar gif, at
     different scales, speeds and blend modes, so the animation already
     baked into the gif reads as one continuously shifting texture behind
     the whole page rather than a static tile. Pure CSS - the gif frames
     do the actual animating, these layers just pan/rotate/breathe it. */
  .bg-fx {
    position: fixed; inset: 0; z-index: -2; overflow: hidden;
    background: var(--color-background);
  }
  .bg-fx .layer {
    position: absolute; inset: -20%;
    background-image: url("projects/personal_site/pushGifBW.gif");
    background-repeat: repeat;
  }
  .bg-fx .layer-1 {
    background-size: 240px 296px;
    opacity: 0.22;
    filter: grayscale(1) contrast(1.2);
    animation: driftA 90s linear infinite;
  }
  .bg-fx .layer-2 {
    background-size: 420px 518px;
    opacity: 0.16;
    mix-blend-mode: overlay;
    filter: grayscale(1) invert(1);
    transform: rotate(180deg);
    animation: driftB 130s linear infinite;
  }
  .bg-fx .layer-3 {
    background-size: 96px 118px;
    opacity: 0.12;
    mix-blend-mode: color-dodge;
    filter: sepia(1) saturate(6) hue-rotate(0deg);
    animation: driftC 55s linear infinite, hueCycle 24s linear infinite;
  }
  .bg-fx .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.35) 55%, rgba(0,0,0,0.7) 100%);
  }
  @keyframes driftA {
    0%   { transform: translate(0, 0); }
    50%  { transform: translate(-6%, 4%); }
    100% { transform: translate(0, 0); }
  }
  @keyframes driftB {
    0%   { transform: rotate(180deg) translate(0, 0); }
    50%  { transform: rotate(182deg) translate(5%, -5%); }
    100% { transform: rotate(180deg) translate(0, 0); }
  }
  @keyframes driftC {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(3%, 3%) scale(1.08); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes hueCycle {
    0% { filter: sepia(1) saturate(6) hue-rotate(0deg); }
    100% { filter: sepia(1) saturate(6) hue-rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-fx .layer { animation: none !important; }
  }

  .navbar {
    height: 96px;
    background-image: url("projects/personal_site/pushGifBW.gif");
    background-size: 300px 200px;
    border-bottom: 1px solid var(--color-border);
  }
  .nav-content {
    max-width: 1100px; height: 100%; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 0 16px; font-family: "Acidic", cursive; font-size: 1.6rem;
  }

  header.banner { text-align: center; padding: 28px 16px 8px; }
  header.banner h1 {
    font-family: "Acidic", cursive;
    font-size: 2.2rem; margin: 0 0 8px; letter-spacing: 1px; color: var(--color-text);
  }
  header.banner .subtitle { color: var(--color-muted); font-size: 0.95rem; margin: 0; }

  hr.separator { border: none; border-top: 1px solid var(--color-border); margin: 24px auto; max-width: 1100px; }

  .controls {
    max-width: 1100px; margin: 0 auto; padding: 0 16px 16px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .controls label { font-weight: 600; color: var(--color-muted); font-size: 0.85rem; }
  .controls input[type="search"], .controls select {
    font-family: inherit; font-size: 0.95rem;
    padding: 8px 10px; border: 1px solid var(--color-border);
    background: var(--color-surface); color: var(--color-text); border-radius: 4px;
  }
  .controls input[type="search"] { flex: 1; min-width: 160px; }

  .count {
    max-width: 1100px; margin: 0 auto; padding: 0 16px 12px;
    font-size: 0.8rem; color: var(--color-muted);
  }

  #hostedNotice, #warn {
    max-width: 1100px; margin: 0 auto; padding: 0 16px;
  }
  .hosted-notice, .warn {
    font-size: 0.85rem; color: var(--color-muted); margin: 0 0 16px;
    border: 1px solid var(--color-border); border-left: 3px solid var(--color-accent);
    background: var(--color-surface); padding: 10px 14px; border-radius: 4px;
  }

  main#grid {
    max-width: 1100px; margin: 0 auto; padding: 4px 16px 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card h2 {
    margin: 0; font-size: 1.1rem; font-family: "Acidic", cursive;
    color: var(--color-text); letter-spacing: 0.5px;
  }
  .badge {
    display: inline-block; font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    background: transparent; color: var(--color-accent);
    border: 1px solid var(--color-accent); padding: 2px 8px; border-radius: 999px; width: fit-content;
  }
  .desc { color: var(--color-muted); font-size: 0.88rem; line-height: 1.5; margin: 0; }
  .usage {
    background: #0d0d0d; border-left: 3px solid var(--color-accent);
    padding: 8px 10px; border-radius: 4px; font-size: 0.82rem; color: var(--color-text);
  }
  .usage strong {
    color: var(--color-accent); display: block; margin-bottom: 2px; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 0.72rem; background: var(--color-background); border: 1px solid var(--color-border);
    color: var(--color-muted); padding: 2px 8px; border-radius: 6px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-block; text-decoration: none; font-size: 0.82rem; font-weight: 600;
    padding: 7px 12px; border-radius: 6px; border: 1px solid var(--color-border);
    background: var(--color-background); color: var(--color-text);
  }
  .btn:visited { color: var(--color-text); }
  .btn:hover { border-color: var(--color-accent); color: var(--color-accent); }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
  .btn-primary:visited { color: #fff; }
  .btn-primary:hover { opacity: 0.85; color: #fff; }
  .action-note { font-size: 0.78rem; color: var(--color-muted); margin: 0; font-style: italic; }
  .meta {
    font-size: 0.72rem; color: var(--color-muted);
    margin-top: auto; display: flex; justify-content: space-between;
    border-top: 1px solid var(--color-border); padding-top: 8px;
  }

  .empty-state {
    max-width: 1100px; margin: 0 auto; color: var(--color-muted); padding: 40px 16px; text-align: center;
  }

  footer.pagefoot {
    max-width: 1100px; margin: 20px auto 40px; padding: 0 16px;
    text-align: center; color: var(--color-muted); font-size: 0.85rem;
  }
  .hitcounter {
    display: inline-flex; gap: 2px; background: var(--color-surface);
    padding: 6px; border: 1px solid var(--color-border); border-radius: 4px; margin: 8px 0;
  }
  .hitcounter span {
    font-family: "Courier New", monospace; font-weight: bold; font-size: 1.1rem;
    background: #000; color: var(--color-accent); padding: 1px 5px; border-radius: 2px;
  }
  footer.pagefoot .foot-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  footer.pagefoot .webring { font-size: 0.78rem; margin-top: 10px; }
  footer.pagefoot .webring a { color: var(--color-accent); margin: 0 4px; text-decoration: underline; }
</style>
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="layer layer-1"></div>
    <div class="layer layer-2"></div>
    <div class="layer layer-3"></div>
    <div class="vignette"></div>
  </div>

  <nav class="navbar">
    <div class="nav-content">Koshka Kochka</div>
  </nav>

  <hr class="separator">

  <div class="controls">
    <label for="search">Find:</label>
    <input type="search" id="search" placeholder="type to search...">
    <label for="category">Show:</label>
    <select id="category"><option value="">All categories</option></select>
  </div>
  <div class="count" id="count"></div>
  <div id="hostedNotice"></div>
  <div id="warn"></div>

  <main id="grid"></main>
  <div class="empty-state" id="emptyState" style="display:none;">No projects match your filters.</div>

  <hr class="separator">

  <footer class="pagefoot">
    <div class="foot-label">You are visitor number</div>
    <div class="hitcounter" id="hitcounter"></div>
    <div class="webring">
      <a href="https://github.com/krossruiz" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

<script>
const CATEGORY_LABELS = {
  "web-app": "Web App",
  "browser-extension": "Browser Extension",
  "vr-ar": "VR / AR",
  "game-dev": "Game Dev",
  "python-tool": "Python Tool",
  "cli-tool": "CLI Tool",
  "ai-ml": "AI / ML",
  "other": "Other"
};

async function loadJSON(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) throw new Error("Failed to load " + path);
  return res.json();
}

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

const IS_LOCAL = ["localhost", "127.0.0.1", "::1", ""].includes(location.hostname);

if (!IS_LOCAL) {
  document.addEventListener("DOMContentLoaded", () => {
    const el = document.getElementById("hostedNotice");
    if (el) el.innerHTML = `<div class="hosted-notice">You're viewing the hosted copy of this catalog. Most projects' Launch/Run-in-Browser buttons work right here (their files are embedded in this deployment); a few large ones are local-only - use "View on GitHub" on any card to get the code.</div>`;
  });
}

// Embedded projects ship their files inside this site (under projects/<id>/),
// so Launch and Run-in-Browser work identically whether this catalog is local or hosted.
// Non-embedded launch/pyodide projects (too large to bundle, e.g. sitoaqui, gemma3ninferencetest)
// only run when this catalog itself is served locally, via the sibling folder one level up.
function buildActions(p, downloadSizes) {
  const buttons = [];
  const notes = [];

  if (p.liveUrl) {
    buttons.push(`<a class="btn btn-primary" href="${escapeHTML(p.liveUrl)}" target="_blank" rel="noopener">&#9658; Live Demo</a>`);
  }

  if (p.runtime === "launch" && p.entry) {
    if (p.embedded) {
      const url = `projects/${encodeURIComponent(p.id)}/${p.entry}`;
      buttons.push(`<a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">&#9658; Launch</a>`);
      if (p.launchNote) notes.push(p.launchNote);
    } else if (IS_LOCAL) {
      const url = `../${encodeURIComponent(p.id)}/${p.entry}`;
      buttons.push(`<a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">&#9658; Launch</a>`);
      notes.push("Too large to embed in the hosted site - this button only works when running the catalog locally.");
      if (p.launchNote) notes.push(p.launchNote);
    } else {
      notes.push("Too large to embed in the hosted site - clone the repo, or run this catalog locally, to launch it.");
    }
  } else if (p.runtime === "pyodide" && p.pyFile) {
    if (p.embedded) {
      const runnerUrl = `python-runner.html?src=${encodeURIComponent(`projects/${p.id}/${p.pyFile}`)}&mode=${encodeURIComponent(p.pyMode || "plain")}&title=${encodeURIComponent(p.title || p.id)}`;
      buttons.push(`<a class="btn btn-primary" href="${runnerUrl}" target="_blank" rel="noopener">&#9658; Run in Browser</a>`);
    } else if (IS_LOCAL) {
      const runnerUrl = `python-runner.html?src=${encodeURIComponent(`../${p.id}/${p.pyFile}`)}&mode=${encodeURIComponent(p.pyMode || "plain")}&title=${encodeURIComponent(p.title || p.id)}`;
      buttons.push(`<a class="btn btn-primary" href="${runnerUrl}" target="_blank" rel="noopener">&#9658; Run in Browser</a>`);
    } else {
      notes.push("Runs in-browser via Pyodide when this catalog is served locally - clone the repo to run it yourself.");
    }
  } else if (p.runtime === "extension") {
    notes.push(p.extensionKind === "vscode"
      ? "VS Code extension - download or clone, then install the .vsix or run via F5 in a dev host."
      : "Chrome extension - download or clone, then load unpacked via chrome://extensions.");
  }

  if (IS_LOCAL) {
    const hasZip = downloadSizes && Object.prototype.hasOwnProperty.call(downloadSizes, p.id);
    if (hasZip) {
      buttons.push(`<a class="btn" href="downloads/${encodeURIComponent(p.id)}.zip" download>&#128190; Download (${downloadSizes[p.id]} MB)</a>`);
    } else if (p.skipDownload) {
      notes.push("Too large to package as a download - browse the folder locally instead.");
    } else if ((!p.runtime || p.runtime === "download") && !p.liveUrl) {
      notes.push("No web download built yet - run build-downloads.ps1.");
    }
  }

  if (p.repo) {
    buttons.push(`<a class="btn" href="${escapeHTML(p.repo)}" target="_blank" rel="noopener">View on GitHub</a>`);
  } else if (!IS_LOCAL) {
    notes.push("Not yet published to GitHub.");
  }

  return { buttons, notes };
}

function render(projects, downloadSizes) {
  const grid = document.getElementById("grid");
  const emptyState = document.getElementById("emptyState");
  grid.innerHTML = "";

  if (projects.length === 0) {
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  for (const p of projects) {
    const { buttons, notes } = buildActions(p, downloadSizes);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <span class="badge">${escapeHTML(CATEGORY_LABELS[p.category] || p.category || "Other")}</span>
      <h2>${escapeHTML(p.title || p.id)}</h2>
      <p class="desc">${escapeHTML(p.description || "No description available.")}</p>
      ${p.howToUse ? `<div class="usage"><strong>How to use</strong>${escapeHTML(p.howToUse)}</div>` : ""}
      <div class="tags">${(p.tech || []).map(t => `<span class="tag">${escapeHTML(t)}</span>`).join("")}</div>
      ${buttons.length ? `<div class="actions">${buttons.join("")}</div>` : ""}
      ${notes.length ? `<p class="action-note">${notes.map(escapeHTML).join(" ")}</p>` : ""}
      <div class="meta">
        <span>${escapeHTML(p.id)}</span>
        <span>${escapeHTML(p.lastModified || "")}</span>
      </div>
    `;
    grid.appendChild(card);
  }
}

function renderHitCounter() {
  const el = document.getElementById("hitcounter");
  if (!el) return;
  let count;
  try {
    count = parseInt(localStorage.getItem("pd_hit_count_v2") || "0", 10) + 1;
    localStorage.setItem("pd_hit_count_v2", String(count));
  } catch (e) {
    count = 1;
  }
  const digits = String(count).padStart(6, "0").split("");
  el.innerHTML = digits.map(d => `<span>${d}</span>`).join("");
}

(async function init() {
  let projects = [];
  let admin = { visibility: {} };
  const warnEl = document.getElementById("warn");

  renderHitCounter();

  try {
    projects = await loadJSON("projects.json");
  } catch (e) {
    warnEl.innerHTML = `<div class="warn">Could not load projects.json. If you opened this file directly (file://), start a local server instead — see README.md.</div>`;
    return;
  }

  try {
    admin = await loadJSON("admin.json");
  } catch (e) {
    // admin.json missing or unreadable: default to showing everything
  }

  let downloadSizes = {};
  try {
    downloadSizes = await loadJSON("downloads-manifest.json");
  } catch (e) {
    // no zips built yet (run build-downloads.ps1)
  }

  const visibility = admin.visibility || {};
  const visibleProjects = projects.filter(p => visibility[p.id] !== false);

  const categorySelect = document.getElementById("category");
  const seenCategories = [...new Set(visibleProjects.map(p => p.category))].sort();
  for (const cat of seenCategories) {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = CATEGORY_LABELS[cat] || cat;
    categorySelect.appendChild(opt);
  }

  const searchInput = document.getElementById("search");
  const countEl = document.getElementById("count");

  function applyFilters() {
    const q = searchInput.value.trim().toLowerCase();
    const cat = categorySelect.value;
    const filtered = visibleProjects.filter(p => {
      const matchesCat = !cat || p.category === cat;
      const haystack = [p.title, p.id, p.description, p.howToUse, ...(p.tech || [])].join(" ").toLowerCase();
      const matchesQ = !q || haystack.includes(q);
      return matchesCat && matchesQ;
    });
    countEl.textContent = `Showing ${filtered.length} of ${visibleProjects.length} visible projects (${projects.length - visibleProjects.length} hidden via admin.json)`;
    render(filtered, downloadSizes);
  }

  searchInput.addEventListener("input", applyFilters);
  categorySelect.addEventListener("change", applyFilters);
  applyFilters();
})();
</script>
</body>
</html>
